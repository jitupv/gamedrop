<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Jeetle">
  <rect width="512" height="512" rx="112" fill="#12151b"/>
  <!-- Bold geometric J: straight stem with a flat top, one true semicircular hook
       ending in a flat cut (the way a real J terminates - a round cap reads as "u").
       Outer hook radius 101, inner 39, band 62. Reads crisply down to 16px.
       Mark spans the middle ~54% of the frame, inside the maskable safe zone. -->
  <path fill="#e6c26b" d="M262 140H324V266A101 101 0 0 1 122 266H184A39 39 0 0 0 262 266Z"/>
  <!-- the brand period, sitting on the J's baseline, right of the hook -->
  <circle cx="372" cy="340" r="27" fill="#e6c26b"/>
</svg>
